version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      extension-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: weekly
    groups:
      dashboard-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
